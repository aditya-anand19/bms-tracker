name: BookMyShow Tracker

# How it behaves:
# - Every 5 minutes GitHub starts a run (only one runs at a time).
# - The run first checks if your phone is reachable on Tailscale.
#     Phone OFF -> run ends quietly in ~1 minute (one "disconnected" message
#                  only if the phone was on at the previous run).
#     Phone ON  -> EVERYTHING Chrome loads goes through the phone (via a local
#                  proxy that runs as its own user, routed through Tailscale);
#                  everything else (Telegram, phone checks, installs) uses
#                  GitHub's own internet. Then tracker.py runs for ~5.5 hours:
#                  checks every minute; if the phone drops it waits for it.
# - Telegram: phone connected / disconnected (once each), "Still running" after
#   every reconnect and daily at ~12 PM IST, BOOK NOW every 30 s when shows open.
#   ALL messages are written by tracker.py (same format everywhere) and sent over
#   GitHub's own internet, never through your phone. Copies also go to email
#   (Gmail) if the EMAIL_* secrets are set; BOOK NOW is emailed once per opening.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bms-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional email copies (Gmail). If these secrets don't exist, email is simply off.
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      BMS_PROXY: http://127.0.0.1:8899
    steps:
      - uses: actions/checkout@v4

      # 1. Join your Tailscale network (not routing anything through the phone yet)
      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: github-bms-tracker
          args: --accept-dns=false

      # Name lookups (DNS) must use GitHub's own DNS, never your phone. Otherwise,
      # when the phone goes offline, lookups like api.telegram.org hang and
      # messages get stuck until the phone comes back.
      - name: Keep DNS on GitHub's own servers
        run: |
          sudo tailscale set --accept-dns=false || true
          sudo resolvectl revert tailscale0 2>/dev/null || true
          sudo resolvectl flush-caches 2>/dev/null || true
          echo "DNS servers in use:"; resolvectl dns 2>/dev/null || cat /etc/resolv.conf

      # 2. What was the phone's state at the end of the previous run?
      - name: Load last phone state
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          key: phonestate-lookup-${{ github.run_id }}
          restore-keys: phonestate-

      # 3. Is the phone reachable right now?
      - name: Is the phone online?
        id: phone
        run: |
          LAST=$(head -n1 state.txt 2>/dev/null | tr -d '\r\n ' || true)
          [ -z "$LAST" ] && LAST=unknown
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          ONLINE=no
          for _ in 1 2 3; do
            if sudo tailscale ping --until-direct=false --c 2 --timeout 8s "$EXIT_NODE"; then
              ONLINE=yes; break
            fi
            sleep 5
          done
          echo "online=$ONLINE" >> "$GITHUB_OUTPUT"
          echo "Previous state: $LAST | Phone online now: $ONLINE"

      # ---------------- Phone OFF ----------------
      - name: Phone offline - tell you (only if it was on before)
        if: steps.phone.outputs.online == 'no' && (steps.phone.outputs.last == 'online' || steps.phone.outputs.last == 'noexit')
        run: python3 tracker.py notify disconnected || true

      - name: Phone offline - remember state
        if: steps.phone.outputs.online == 'no' && steps.phone.outputs.last != 'offline'
        run: echo offline > state.txt

      - name: Phone offline - save state
        if: steps.phone.outputs.online == 'no' && steps.phone.outputs.last != 'offline'
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-off

      # ---------------- Phone ON: set up ----------------
      - uses: actions/setup-python@v5
        if: steps.phone.outputs.online == 'yes'
        with:
          python-version: "3.12"
          cache: "pip"

      # Installs use GitHub's internet (not your phone)
      - name: Install libraries
        if: steps.phone.outputs.online == 'yes'
        timeout-minutes: 12
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq tinyproxy

      # A small local proxy for Chrome. It is started by root (so it can always read
      # its config) and then switches itself to the restricted user "bmsproxy".
      # Everything sent by that user is later routed through your phone.
      # This step never fails the run: if the proxy can't start, you get a message.
      - name: Start Chrome's proxy
        id: proxy
        if: steps.phone.outputs.online == 'yes'
        run: |
          sudo systemctl stop tinyproxy 2>/dev/null || true
          sudo systemctl disable tinyproxy 2>/dev/null || true
          sudo pkill -x tinyproxy 2>/dev/null || true
          id -u bmsproxy >/dev/null 2>&1 || sudo useradd -r -M -s /usr/sbin/nologin bmsproxy || true
          sudo mkdir -p /etc/tinyproxy
          printf '%s\n' "User bmsproxy" "Group bmsproxy" "Port 8899" "Listen 127.0.0.1" \
            "Timeout 120" "MaxClients 200" "Allow 127.0.0.1" "LogLevel Error" "DisableViaHeader Yes" \
            | sudo tee /etc/tinyproxy/tinyproxy.conf >/dev/null
          sudo tinyproxy -c /etc/tinyproxy/tinyproxy.conf || true
          OK=no
          for _ in 1 2 3 4 5; do
            sleep 1
            if pgrep -u bmsproxy -x tinyproxy >/dev/null && timeout 3 bash -c '</dev/tcp/127.0.0.1/8899' 2>/dev/null; then
              OK=yes; break
            fi
          done
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "PROXY_UID=$(id -u bmsproxy 2>/dev/null || echo 0)" >> "$GITHUB_ENV"
          echo "Chrome's proxy running as bmsproxy on 127.0.0.1:8899: $OK"
          ps -o user,pid,cmd -C tinyproxy || true

      # Route ONLY the proxy user's traffic (= everything Chrome loads) through the
      # phone. Everything else keeps using GitHub's own internet.
      # (Tailscale keeps its "through the phone" routes in table 52.)
      - name: Route Chrome's traffic through the phone
        id: route
        if: steps.phone.outputs.online == 'yes'
        env:
          PROXY_OK: ${{ steps.proxy.outputs.ok }}
        run: |
          ROUTED=no
          REASON=""
          if [ "$PROXY_OK" != "yes" ]; then
            REASON="Chrome's proxy didn't start on the GitHub server."
          elif ! sudo tailscale set --exit-node="$EXIT_NODE"; then
            REASON="Couldn't use your phone as the exit node."
          else
            sleep 3
            # Make sure DNS still uses GitHub's own servers (not the phone)
            sudo tailscale set --accept-dns=false || true
            sudo resolvectl revert tailscale0 2>/dev/null || true
            sudo resolvectl flush-caches 2>/dev/null || true
            echo "DNS servers in use:"; resolvectl dns 2>/dev/null || cat /etc/resolv.conf
            # Proxy user (Chrome) + your Tailscale network -> through the phone
            sudo ip rule add pref 1000 uidrange "${PROXY_UID}-${PROXY_UID}" lookup 52 || true
            sudo ip rule add pref 1000 to 100.64.0.0/10 lookup 52 || true
            # Everything else -> GitHub's normal internet
            sudo ip rule add pref 1100 lookup main || true
            sudo ip route flush cache || true
            echo "Routing rules:"; ip rule show

            # Self-check through the SAME proxy Chrome uses: must appear from India.
            INFO=$(curl --noproxy '' -s --max-time 30 -x http://127.0.0.1:8899 https://ipinfo.io/json || true)
            COUNTRY=$(echo "$INFO" | jq -r '.country // empty' 2>/dev/null || true)
            ISP=$(echo "$INFO" | jq -r '.org // empty' 2>/dev/null || true)
            if [ -z "$COUNTRY" ]; then
              # backup check via Cloudflare
              TRACE=$(curl --noproxy '' -s --max-time 30 -x http://127.0.0.1:8899 https://www.cloudflare.com/cdn-cgi/trace || true)
              COUNTRY=$(echo "$TRACE" | grep '^loc=' | cut -d= -f2 | tr -d '\r')
            fi
            [ -z "$ISP" ] && ISP=unknown
            echo "Chrome's traffic appears from: ${ISP} (${COUNTRY})"
            echo "Telegram/other traffic appears from: $(curl -s --max-time 15 https://ipinfo.io/org | head -n1)"
            if [ "$COUNTRY" = "IN" ]; then
              ROUTED=yes
            elif [ -z "$COUNTRY" ]; then
              REASON="No internet through your phone (is 'Run as exit node' ON?)."
            else
              REASON="Traffic through your phone came out in '${COUNTRY}', not India (is 'Run as exit node' ON?)."
            fi
          fi
          echo "routed=$ROUTED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Routed through phone: $ROUTED ${REASON}"

      # ---------------- Couldn't start (proxy or phone routing problem) ----------------
      - name: Routing failed - tell you (once)
        if: steps.route.outputs.routed == 'no' && steps.phone.outputs.last != 'noexit'
        env:
          ROUTE_FAIL_REASON: ${{ steps.route.outputs.reason }}
        run: |
          python3 tracker.py notify routing_failed || true
          echo noexit > state.txt

      - name: Routing failed - save state
        if: steps.route.outputs.routed == 'no' && steps.phone.outputs.last != 'noexit'
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-noexit

      # ---------------- Routed OK: run the tracker ----------------
      - name: Tell you the phone (re)connected
        if: steps.route.outputs.routed == 'yes' && steps.phone.outputs.last != 'online'
        run: python3 tracker.py notify connected || true

      - name: Remember state (online)
        if: steps.route.outputs.routed == 'yes'
        run: echo online > state.txt

      - name: Save state (online)
        if: steps.route.outputs.routed == 'yes' && steps.phone.outputs.last != 'online'
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-on

      - name: Load daily-message memory
        if: steps.route.outputs.routed == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: heartbeat.txt
          key: heartbeat-lookup-${{ github.run_id }}
          restore-keys: heartbeat-

      - name: Check BookMyShow
        id: tracker
        if: steps.route.outputs.routed == 'yes'
        env:
          JUST_CONNECTED: ${{ steps.phone.outputs.last != 'online' }}
        run: xvfb-run -a python tracker.py

      # ---------------- Save memory for the next run ----------------
      - name: Save phone state for the next run
        if: always() && steps.tracker.outcome != 'skipped' && hashFiles('state.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-end

      - name: Save daily-message memory
        if: always() && steps.tracker.outcome != 'skipped' && hashFiles('heartbeat.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: heartbeat.txt
          key: heartbeat-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save screenshot of the page
        if: always() && steps.tracker.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: last-check-screenshot
          path: last_check.png
          retention-days: 1
          if-no-files-found: ignore
