name: BookMyShow Tracker

# How it behaves:
# - Every 5 minutes GitHub starts a run (only one runs at a time).
# - The run first checks if your phone is reachable on Tailscale.
#     Phone OFF -> run ends quietly in ~1 minute (one "disconnected" message
#                  only if the phone was online last time).
#     Phone ON  -> ONLY BookMyShow (Cloudflare) traffic goes through the phone;
#                  everything else (Telegram, phone checks, installs) uses
#                  GitHub's own internet. Then tracker.py runs for ~5.5 hours:
#                  checks every minute; if the phone drops it waits for it.
# - Telegram: phone connected / disconnected (once each), "Still running" after
#   every reconnect and daily at ~12 PM IST, BOOK NOW every 30 s when shows open.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bms-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      # 1. Join your Tailscale network (not routing anything through the phone yet)
      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: github-bms-tracker
          args: --accept-dns=false

      # 2. What was the phone's state at the end of the previous run?
      - name: Load last phone state
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          key: phonestate-lookup-${{ github.run_id }}
          restore-keys: phonestate-

      # 3. Is the phone reachable right now?
      - name: Is the phone online?
        id: phone
        run: |
          LAST=$(head -n1 state.txt 2>/dev/null | tr -d '\r\n ' || true)
          [ -z "$LAST" ] && LAST=unknown
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          ONLINE=no
          for _ in 1 2 3; do
            if sudo tailscale ping --until-direct=false --c 2 --timeout 8s "$EXIT_NODE"; then
              ONLINE=yes; break
            fi
            sleep 5
          done
          echo "online=$ONLINE" >> "$GITHUB_OUTPUT"
          echo "Previous state: $LAST | Phone online now: $ONLINE"

      # ---------------- Phone OFF ----------------
      - name: Phone offline - tell you (only if it was online before)
        if: steps.phone.outputs.online == 'no' && steps.phone.outputs.last == 'online'
        run: |
          curl -s --max-time 30 --retry 3 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="⏸️ Phone disconnected - BMS tracker paused.
          I'll keep looking for your phone (no more messages until it's back)." || true

      - name: Phone offline - remember state
        if: steps.phone.outputs.online == 'no' && steps.phone.outputs.last != 'offline'
        run: echo offline > state.txt

      - name: Phone offline - save state
        if: steps.phone.outputs.online == 'no' && steps.phone.outputs.last != 'offline'
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-off

      # ---------------- Phone ON: set up ----------------
      - uses: actions/setup-python@v5
        if: steps.phone.outputs.online == 'yes'
        with:
          python-version: "3.12"
          cache: "pip"

      # Installs use GitHub's internet (not your phone)
      - name: Install libraries
        if: steps.phone.outputs.online == 'yes'
        timeout-minutes: 12
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Only BookMyShow's traffic goes through the phone. BookMyShow sits behind
      # Cloudflare, so: Cloudflare addresses -> phone; everything else -> GitHub's
      # own internet. (Tailscale keeps its routes in table 52.)
      - name: Route ONLY BookMyShow through the phone
        id: route
        if: steps.phone.outputs.online == 'yes'
        run: |
          ROUTED=no
          if sudo tailscale set --exit-node="$EXIT_NODE"; then
            sleep 3
            # Everything else: GitHub's normal internet
            sudo ip rule add pref 1100 lookup main || true
            # Your Tailscale network + Cloudflare (BookMyShow): through the phone
            for r in 100.64.0.0/10 \
                     173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 \
                     141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 \
                     197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 \
                     104.24.0.0/14 172.64.0.0/13 131.0.72.0/22; do
              sudo ip rule add pref 1000 to "$r" lookup 52 || true
            done
            sudo ip route flush cache || true
            echo "Routing rules:"; ip rule show

            # Self-check: where does Cloudflare (BookMyShow) see us? Should be India.
            TRACE=$(curl -4 -s --max-time 30 https://www.cloudflare.com/cdn-cgi/trace || true)
            CF_IP=$(echo "$TRACE" | grep '^ip=' | cut -d= -f2 | tr -d '\r')
            CF_LOC=$(echo "$TRACE" | grep '^loc=' | cut -d= -f2 | tr -d '\r')
            ISP=$(curl -s --max-time 15 "https://ipinfo.io/${CF_IP}/org" | head -n1 | tr -d '\r"{}' || true)
            [ -z "$ISP" ] && ISP=unknown
            echo "BookMyShow traffic appears from: ${CF_IP} (${CF_LOC}) - ${ISP}"
            echo "Telegram/other traffic appears from: $(curl -s --max-time 15 https://ipinfo.io/org | head -n1)"
            echo "ISP=${ISP} (${CF_LOC})" >> "$GITHUB_ENV"
            if [ "$CF_LOC" = "IN" ]; then ROUTED=yes; fi
          fi
          echo "routed=$ROUTED" >> "$GITHUB_OUTPUT"
          echo "Routed through phone: $ROUTED"

      # ---------------- Routing failed (e.g. 'Run as exit node' is off) ----------------
      - name: Routing failed - tell you (once)
        if: steps.route.outputs.routed == 'no' && steps.phone.outputs.last != 'noexit'
        run: |
          curl -s --max-time 30 --retry 3 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="⚠️ Tailscale is on, but BookMyShow traffic couldn't be routed through your phone.
          Check that 'Run as exit node' is ON in the Tailscale app. I'll retry every 5 minutes." || true
          echo noexit > state.txt

      - name: Routing failed - save state
        if: steps.route.outputs.routed == 'no' && steps.phone.outputs.last != 'noexit'
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-noexit

      # ---------------- Routed OK: run the tracker ----------------
      - name: Tell you the phone (re)connected
        if: steps.route.outputs.routed == 'yes' && steps.phone.outputs.last != 'online'
        run: |
          curl -s --max-time 30 --retry 3 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="✅ Phone connected - BMS tracker is running.
          Network: ${ISP}
          Doing a check now; you'll get a confirmation in a minute." || true

      - name: Remember state (online)
        if: steps.route.outputs.routed == 'yes'
        run: echo online > state.txt

      - name: Save state (online)
        if: steps.route.outputs.routed == 'yes' && steps.phone.outputs.last != 'online'
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-on

      - name: Load daily-message memory
        if: steps.route.outputs.routed == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: heartbeat.txt
          key: heartbeat-lookup-${{ github.run_id }}
          restore-keys: heartbeat-

      - name: Check BookMyShow
        id: tracker
        if: steps.route.outputs.routed == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JUST_CONNECTED: ${{ steps.phone.outputs.last != 'online' }}
        run: xvfb-run -a python tracker.py

      # ---------------- Save memory for the next run ----------------
      - name: Save phone state for the next run
        if: always() && steps.tracker.outcome != 'skipped' && hashFiles('state.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: phonestate-${{ github.run_id }}-${{ github.run_attempt }}-end

      - name: Save daily-message memory
        if: always() && steps.tracker.outcome != 'skipped' && hashFiles('heartbeat.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: heartbeat.txt
          key: heartbeat-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save screenshot of the page
        if: always() && steps.tracker.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: last-check-screenshot
          path: last_check.png
          retention-days: 1
          if-no-files-found: ignore
